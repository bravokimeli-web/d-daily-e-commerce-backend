services:
  - type: web
    name: d-daily-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: PAYSTACK_SECRET_KEY
        sync: false # Set this in Render dashboard
      - key: PAYSTACK_PUBLIC_KEY
        sync: false # Set this in Render dashboard
      - key: FRONTEND_URL
        value: https://d-daily-frontend.vercel.app
      - key: JWT_SECRET
        sync: false # Set this in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 180d
