services:
  - type: web
    name: d-daily-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MPESA_BASE_URL
        value: https://api.safaricom.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://api.ddaily.co.ke/api/webhooks/mpesa
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerBuyGoodsOnline
      - key: FRONTEND_URL
        value: https://www.ddaily.co.ke
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 180d
